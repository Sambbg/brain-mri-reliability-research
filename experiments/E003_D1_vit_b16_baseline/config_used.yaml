dataset:
  dataset_id: D1
  split_csv: data/splits/D1_leakage_aware_split.csv
  image_root: .
  class_names:
    - glioma
    - meningioma
    - notumor
    - pituitary

model:
  architecture: vit_b_16
  pretrained: true
  num_classes: 4

training:
  image_size: 224
  batch_size: 16
  num_epochs: 20
  epochs: 20
  early_stopping_patience: 5
  early_stopping:
    enabled: true
    patience: 5
  learning_rate: 0.00005
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  num_workers: 4
  seed: 42

data_loading:
  image_size: 224
  batch_size: 16
  num_workers: 4
  pin_memory: true

optimizer:
  name: adamw
  learning_rate: 0.00005
  weight_decay: 0.0001

scheduler:
  name: cosine

outputs:
  output_dir: experiments/E003_D1_vit_b16_baseline
  experiment_dir: experiments/E003_D1_vit_b16_baseline
  save_best_model: true
  monitor_metric: val_macro_f1

experiment:
  id: E003
  name: D1_internal_leakage_aware_vit_b16_baseline
