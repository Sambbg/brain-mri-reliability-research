experiment:
  id: E003
  name: D1_internal_leakage_aware_vit_b16_baseline
dataset:
  dataset_id: D1
  split_csv: data/splits/D1_leakage_aware_split.csv
  classes:
  - glioma
  - meningioma
  - notumor
  - pituitary
model:
  architecture: vit_b_16
  pretrained: true
  num_classes: 4
data_loading:
  image_size: 224
  batch_size: 16
  num_workers: 4
  pin_memory: true
training:
  seed: 46
  epochs: 20
  optimizer: adamw
  learning_rate: 5.0e-05
  weight_decay: 0.0001
  early_stopping:
    enabled: true
    patience: 5
    monitor: val_macro_f1
    mode: max
outputs:
  output_dir: experiments/E003_D1_vit_b16_baseline
